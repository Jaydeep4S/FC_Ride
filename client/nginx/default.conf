server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Rider photo uploads go through /api.
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The service worker and manifest must never be cached, or PWA updates stall.
  location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Hashed build assets are safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
